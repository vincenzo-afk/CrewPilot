[project]
name = "crewpilot"
version = "0.2.0"
description = "CrewPilot — Evidence-Driven Bug Investigation Squad"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # Line length is kept flexible for prompts and message templates
]

[tool.ruff.format]
exclude = [
    "agent/**",
    "switch/**",
    "config.py",
    "github_issues.py",
    "main.py",
]
